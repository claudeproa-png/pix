<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celular Encontrado</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      background: #000;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas {
      display: none;
    }

    .controls {
      background: #1a1a1a;
      padding: 20px;
      text-align: center;
    }

    .info {
      color: #fff;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .contact {
      color: #ffd700;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 15px;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 12px;
      padding: 8px;
      margin-top: 10px;
      border-radius: 6px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #4caf50;
      color: white;
    }

    .status.error {
      background: #f44336;
      color: white;
    }

    .status.info {
      background: #2196f3;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="camera-wrapper">
      <video id="camera" playsinline autoplay></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <div class="info">
        📱 Se encontrou este celular, clique no botão abaixo para notificar o dono
      </div>

      <div class="contact">
        👤 Propriedade de: SEU NOME — (51) 90000-0000
      </div>

      <button id="btnEnviar" onclick="capturarEEnviar()">
        ✅ Notificar Dono
      </button>

      <div id="status" class="status"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-database.js"></script>

  <script>
    // ⚠️ SUBSTITUA COM SUA URL DO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyExample123456789",
      authDomain: "seu-projeto-firebase.firebaseapp.com",
      databaseURL: "https://seu-projeto-default-rtdb.firebaseio.com",
      projectId: "seu-projeto-firebase",
      storageBucket: "seu-projeto-firebase.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef1234567890"
    };

    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.log("Firebase não configurado:", e);
    }

    const video = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const btnEnviar = document.getElementById('btnEnviar');
    const statusDiv = document.getElementById('status');

    // Iniciar câmera
    async function iniciarCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        mostrarStatus('❌ Câmera não disponível', 'error');
        console.error('Erro câmera:', err);
      }
    }

    // Capturar foto
    function capturarFoto() {
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    // Capturar localização
    async function capturarLocalizacao() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve(null);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            const localizacao = {
              latitude: lat,
              longitude: lng,
              precisao: Math.round(accuracy),
              timestamp: new Date().toLocaleString('pt-BR'),
              googleMapsUrl: `https://maps.google.com/?q=${lat},${lng}`
            };

            // Tentar obter endereço
            try {
              const response = await fetch(
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
              );
              const data = await response.json();
              localizacao.endereco = {
                rua: data.address?.road || '',
                numero: data.address?.house_number || '',
                bairro: data.address?.suburb || data.address?.city || '',
                estado: data.address?.state || '',
                pais: data.address?.country || ''
              };
            } catch (e) {
              localizacao.endereco = null;
            }

            resolve(localizacao);
          },
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    async function capturarEEnviar() {
      if (!db) {
        mostrarStatus('❌ Sistema não configurado', 'error');
        return;
      }

      btnEnviar.disabled = true;
      btnEnviar.innerHTML = '<span class="spinner"></span>Capturando...';

      try {
        // Capturar localização
        const localizacao = await capturarLocalizacao();

        // Capturar foto
        const fotoBase64 = capturarFoto();

        // Preparar dados
        const timestamp = new Date().getTime();
        const dados = {
          timestamp: new Date().toLocaleString('pt-BR'),
          foto: fotoBase64.substring(0, 500000),
          localizacao: localizacao || { erro: 'Localização não disponível' },
          userAgent: navigator.userAgent
        };

        // Enviar para Firebase
        await db.ref('capturas/' + timestamp).set(dados);

        mostrarStatus('✅ Obrigado! Dono notificado.', 'success');
        btnEnviar.innerHTML = '✅ Enviado';

        setTimeout(() => {
          btnEnviar.disabled = false;
          btnEnviar.innerHTML = '✅ Notificar Dono';
        }, 3000);

      } catch (error) {
        console.error('Erro:', error);
        mostrarStatus('❌ Erro ao enviar. Tente novamente.', 'error');
        btnEnviar.disabled = false;
        btnEnviar.innerHTML = '✅ Notificar Dono';
      }
    }

    function mostrarStatus(msg, tipo) {
      statusDiv.textContent = msg;
      statusDiv.className = 'status show ' + tipo;
      setTimeout(() => {
        statusDiv.className = 'status';
      }, 4000);
    }

    iniciarCamera();
  </script>
</body>
</html>
